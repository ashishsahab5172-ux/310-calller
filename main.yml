name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || echo "no gradlew"
          ./gradlew assembleDebug 2>&1 || gradle assembleDebug 2>&1 || ./gradlew build || gradle build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 310Caller-APK
          path: app/build/outputs/apk/debug/*.apk
